# Deploy Azure Backend to Azure Container Apps
#
# This workflow builds and deploys the ArtTherapy+ API to Azure Container Apps.
#
# Prerequisites:
# 1. Create an Azure Container Registry (ACR)
# 2. Create an Azure Container Apps Environment
# 3. Create an Azure Container App
# 4. Set up the following GitHub Secrets:
#    - AZURE_CREDENTIALS: Service principal JSON for Azure CLI authentication
#    - ACR_LOGIN_SERVER: ACR login server (e.g., myacr.azurecr.io)
#    - ACR_USERNAME: ACR username
#    - ACR_PASSWORD: ACR password
#    - AZURE_RESOURCE_GROUP: Resource group name
#    - AZURE_CONTAINER_APP_NAME: Container App name

name: Deploy Azure Backend

on:
  push:
    branches:
      - main
    paths:
      - 'azure-backend/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: arttherapy-plus-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./azure-backend
          file: ./azure-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30
          # Get the container app URL
          APP_URL=$(az containerapp show \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "Checking health endpoint at https://$APP_URL/api/health"
          curl -f "https://$APP_URL/api/health" || exit 1
          echo "Deployment verified successfully!"
